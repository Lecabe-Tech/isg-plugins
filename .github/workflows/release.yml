# The ONLY way to publish a release (SPEC-001 REQ-REL-02, 03, 09; implementer note 7).
# Run it from Actions > release > Run workflow, branch "main", after the release PR was merged.
# It never commits. Order: gates (a-f) -> Windows smoke test (g) -> tag, GitHub Release, move "stable" (h-j).
# Any failed step stops everything after it. Free runners only; no secrets besides the built-in GITHUB_TOKEN.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write        # push the tag and the stable branch
  pull-requests: read    # read the merged PR and its reviews

concurrency:
  group: release
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: '2.1.317'   # = MIN_CLAUDE_VERSION (VAL-08: the release is validated with the minimum version)

jobs:
  gates:
    name: gates (a-f)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.gates.outputs.version }}
      tag: ${{ steps.gates.outputs.tag }}
      rerun: ${{ steps.gates.outputs.rerun }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: (a-e) authorization, branch, PR approval, version, stable
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-gates.mjs
      - name: (e, f) changelog section, no placeholders, names
        run: node scripts/ci/check-consistency.mjs --release
      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: (f) VAL-01 and VAL-02 claude plugin validate --strict
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/isg-model-alignment --strict
      - name: (f) VAL-11 and VAL-13
        run: |
          node scripts/ci/check-language.mjs
          node scripts/ci/check-portable.mjs
          node scripts/ci/check-no-root-writes.mjs
          node scripts/ci/check-memory.mjs
      - name: (f) tests
        run: npm test

  smoke-windows:
    name: (g) Windows smoke test
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI (pinned)
        shell: bash
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: VAL-05 install smoke test on Windows (empty plugins root)
        shell: bash
        run: |
          export CLAUDE_CODE_PLUGIN_CACHE_DIR="$(cygpath -w "$(mktemp -d)")"
          export CLAUDE_CONFIG_DIR="$(cygpath -w "$(mktemp -d)")"
          claude plugin validate . --strict
          claude plugin marketplace add "$(cygpath -w "$PWD")"
          claude plugin install isg-model-alignment@isg-plugins
          claude plugin list --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const p=JSON.parse(s).find(x=>x.id==='isg-model-alignment@isg-plugins');
              if(!p||p.enabled!==true){console.error('plugin not installed/enabled',s);process.exit(1)}
              console.log('installed',p.version)})"
      - name: Scripts and tests on Windows
        shell: bash
        run: |
          npm test
          node scripts/ci/check-non-interactive.mjs

  publish:
    name: (h-j) tag, GitHub Release, move stable
    needs: [gates, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Git identity of the bot (tags and branch moves are authored by github-actions[bot])
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: (h) create and push the tag
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          RERUN: ${{ needs.gates.outputs.rerun }}
        run: |
          if [ "$RERUN" = "true" ]; then
            echo "Tag $TAG already exists on this commit: skipping."
          else
            claude plugin tag plugins/isg-model-alignment --push
          fi
          git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"
      - name: (i) publish the GitHub Release with the PT-BR changelog as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gates.outputs.tag }}
          VERSION: ${{ needs.gates.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: skipping."
          else
            node scripts/ci/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "ISG Model Alignment $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: (j) move stable (fast-forward only, never forced)
        run: |
          git fetch origin stable
          if [ "$(git rev-parse origin/stable)" = "$(git rev-parse HEAD)" ]; then
            echo "stable already points to this commit: skipping."
          else
            git push origin HEAD:refs/heads/stable
          fi
          echo "stable is now at $(git ls-remote origin refs/heads/stable | cut -c1-7)"
